# Ruff config — lint + format for the skill farm scripts only
include = [
    "farm_settings.py",
    "skill_farm.py",
    "skill_farm_ui.py",
    "_version.py",
    "farm_core/**/*.py",
    "farm_ui/**/*.py",
    "tests/**/*.py",
    "tools/**/*.py",
]

line-length = 120
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[format]
quote-style = "double"
indent-style = "space"
